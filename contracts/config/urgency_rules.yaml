# OWNER: Member B (brain). Read-only for A and C (C shows it on the dashboard).
# The LLM only EXTRACTS UrgencyFacts. This deterministic table decides priority. First match wins.
# Emotional tone alone never changes priority. Thresholds are starting points, to be reviewed with department staff.
version: 1
rules:
  - id: R-SAFETY
    when: {safety_flag: true}
    priority: P1
    ticket_type: EMERGENCY
    department: emergency
    action: transfer_now          # speak emergency script first, then ticket, alert, transfer
    reason: "Safety, medical or harassment statement"
  - id: R-EXAM-60
    when: {event_type: exam, minutes_to_event_lte: 60, blocked: true}
    priority: P1
    ticket_type: URGENT
    department: exam_cell
    action: transfer_now
    reason: "Exam within 60 minutes and caller blocked"
  - id: R-DEADLINE-24H
    when: {event_type_in: [fee_deadline, form_deadline, admit_card], minutes_to_event_lte: 1440, blocked: true}
    priority: P2
    ticket_type: URGENT
    department: from_event       # fee_deadline->accounts, admit_card->exam_cell, form_deadline->topic match
    action: transfer_if_open_else_callback
    reason: "Deadline within 24 hours and caller blocked"
  - id: R-COMPLAINT
    when: {event_type: complaint}
    priority: P3
    ticket_type: COMPLAINT
    department: from_topic
    action: ticket_after_readback
    reason: "Complaint with no near deadline"
  - id: R-HUMAN
    when: {intent: human_request}
    priority: P3
    ticket_type: HUMAN_REQUEST
    department: from_topic_or_default
    action: transfer_if_open_else_callback
    reason: "Caller asked for a person"
  - id: R-UNANSWERED
    when: {tier: escalate}
    priority: P3
    ticket_type: KNOWLEDGE_GAP
    department: from_topic_or_default
    action: ticket_and_gap
    reason: "Question not covered by approved documents"
  - id: R-FALLBACK
    when: {intent: system_failure}   # raised by the brain itself when the LLM/internal pipeline fails; never matched from caller text
    priority: P3
    ticket_type: SYSTEM_FAILURE
    department: from_topic_or_default
    action: ticket_and_callback
    reason: "Agent could not answer because of a system failure"
  - id: R-ROUTINE
    when: {}
    priority: P4
    ticket_type: null
    action: none
    reason: "Routine information"

# Pre-LLM lexicon (runs first, < 5 ms). Romanised Hindi, Devanagari and English. Matching is case-insensitive and
# token-based after normalisation (punctuation removed), so "behosh ho gaya!" matches "behosh".
# Terms are deliberately recall-biased: a false alarm costs a staff call, a miss can cost a life. Review with staff.
safety_lexicon:
  medical: [ambulance, "ambulance bulao", behosh, bayhosh, behos, "बेहोश", unconscious, faint, fainted, fainting,
            accident, "एक्सीडेंट", "दुर्घटना", bleeding, "khoon", "खून", "heart attack", "dil ka daura", "दिल का दौरा",
            "saans nahi", "सांस नहीं", "saans lene mein", "can't breathe", "cannot breathe", "not breathing",
            "chot lag", "chot lagi", "चोट", seizure, "mirgi", "दौरा पड़", overdose, poison, "zeher", "जहर",
            "medical emergency", "bahut khoon", "tabiyat bahut kharab", "sir se khoon"]
  harassment: [ragging, "रैगिंग", harass, harassment, "harassed", "pareshan kar rahe", "pareshan kar raha", "परेशान कर रहे",
               molest, molested, "chhed chhad", "छेड़छाड़", "dhamki", "धमकी", threat, threatening, stalking, stalker,
               "blackmail", "ब्लैकमेल", "sexual", "yaun shoshan", "यौन उत्पीड़न"]
  self_harm: [suicide, "सुसाइड", "आत्महत्या", "khud ko maar", "khud ko khatam", "jaan de", "jaan dene", "mar jaunga",
              "mar jaungi", "मर जाऊंगा", "मर जाऊँगी", "marna chahta", "marna chahti", "end my life", "kill myself",
              "khudkushi", "ख़ुदकुशी", "खुदकुशी", "zindagi khatam"]
  violence: [fight, "maar peet", "marpeet", "मारपीट", weapon, knife, "chaku", "चाकू", gun, "pistol", "bandook", "बंदूक",
             "attack", "hamla", "हमला", fire, "aag lag", "आग लग", "aag lagi", "blast", "dhamaka", "bomb", "बम"]
human_request_lexicon: ["insaan se baat", "kisi se baat", "kisi insaan", human, "real person", operator, "staff se baat",
                        "press 0", "someone from the college", "talk to a person", "talk to someone", "speak to someone",
                        "speak to a person", "agent se baat", "adhikari se baat", "इंसान से बात", "किसी से बात",
                        "स्टाफ से बात", "ऑपरेटर"]
# Phrases that contain a lexicon word but are not a request for a person (checked before human_request_lexicon).
human_request_exclusions: ["human resource", "human resources", "humanities", "human rights"]

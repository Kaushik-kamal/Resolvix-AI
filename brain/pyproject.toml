[project]
name = "resolvix-brain"
version = "1.0.0"
description = "Resolvix Brain: grounded, safe, multilingual decision engine for the college helpline (Member B)"
requires-python = ">=3.11"
dependencies = [
  "resolvix-contracts>=1.0.0,<2",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "fastembed>=0.3",
  "tiktoken>=0.7",
  "pyyaml>=6",
  "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
resolvix-brain = "resolvix_brain.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["resolvix_brain*"]

[tool.setuptools.package-data]
resolvix_brain = ["prompts/*.md", "prompts/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:fastembed.*", "ignore:.*symlinks.*:UserWarning"]
testpaths = ["tests"]
markers = ["realembed: needs the real multilingual-e5-small model (downloads ~470 MB on first use)", "mocked_integration: Brain + reference runtime + in-memory ops (NOT genuine end-to-end; see docs/INTEGRATION_TEST_PLAN.md)"]
